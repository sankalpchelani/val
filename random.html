<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-width: 380px;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 70px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
    }

    #noBtn {
      background: #ddd;
      color: #333;
      left: 10%;
    }

    .second-text {
      font-size: 18px;
      color: #ff4d6d;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .dog {
      width: 220px;
      margin: 15px auto;
      border-radius: 15px;
    }

    /* CONFETTI */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: pop 1.2s ease-out forwards;
      z-index: 1;
    }

    @keyframes pop {
      0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--x), var(--y)) rotate(540deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- First page -->
    <div id="firstPage">
      <h1>Hey Manasvi 💕</h1>
      <p>
        I wanted to ask you something<br>
        in a way that’s a little different 😌<br><br>
        Will you be my Valentine? 🌹
      </p>

      <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙄</button>
      </div>
    </div>

    <!-- Second page -->
    <div id="secondPage" style="display:none;">
      <div class="second-text">
        Yes 😌 I knew you’d make a good choice.<br>
        Okay bye… you look like the animal below 🐶😂
      </div>

      <img
        class="dog"
        src="https://cdn.pixabay.com/photo/2017/09/25/13/12/dog-2785074_960_720.jpg"
        alt="Cute dog"
      >
    </div>

    <!-- Music -->
    <audio id="music">
      <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const firstPage = document.getElementById("firstPage");
    const secondPage = document.getElementById("secondPage");
    const music = document.getElementById("music");

    noBtn.addEventListener("mouseover", () => {
      noBtn.style.left = Math.random() * 240 + "px";
      noBtn.style.top = Math.random() * 90 + "px";
    });

    function burst(x, y) {
      const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#118ab2", "#ef476f"];

      for (let i = 0; i < 50; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = x + "px";
        c.style.top = y + "px";
        c.style.setProperty("--x", `${Math.random()*600 - 300}px`);
        c.style.setProperty("--y", `${Math.random()*500 - 250}px`);
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1200);
      }
    }

    yesBtn.addEventListener("click", () => {

      // rapid repeating pops
      let count = 0;
      const interval = setInterval(() => {
        burst(0, window.innerHeight / 2);                 // left
        burst(window.innerWidth, window.innerHeight / 2); // right
        burst(window.innerWidth / 2, 0);                  // top
        count++;
        if (count === 6) clearInterval(interval);         // ~4 seconds
      }, 600);

      setTimeout(() => {
        firstPage.style.display = "none";
        secondPage.style.display = "block";
        music.play();
      }, 1800);
    });
  </script>

</body>
</html>

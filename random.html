<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-width: 380px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 70px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: absolute;
      transition: 0.3s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
    }

    #noBtn {
      background: #ddd;
      color: #333;
      left: 10%;
    }

    .second-text {
      font-size: 18px;
      color: #ff4d6d;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .dog {
      width: 220px;
      margin: 15px auto;
      border-radius: 15px;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- First page -->
    <div id="firstPage">
      <h1>Hey Manasvi 💕</h1>
      <p>
        I wanted to ask you something<br>
        in a way that’s a little different 😌<br><br>
        Will you be my Valentine? 🌹
      </p>

      <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙄</button>
      </div>
    </div>

    <!-- Second page -->
    <div id="secondPage" style="display:none;">
      <div class="second-text">
        Yes Mannu 😌 I knew aap acchi choice karogey .<br>
        Okay bye…assi tussi lassi pussi 💖love you  💕💕
      </div>

      <img
        class="dog"
        src="https://cdn.pixabay.com/photo/2017/09/25/13/12/dog-2785074_960_720.jpg"
        alt="Cute dog being loved"
      >
    </div>

    <!-- Music -->
    <audio id="music">
      <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const music = document.getElementById("music");

    const firstPage = document.getElementById("firstPage");
    const secondPage = document.getElementById("secondPage");

    noBtn.addEventListener("mouseover", () => {
      noBtn.style.left = Math.random() * 240 + "px";
      noBtn.style.top = Math.random() * 90 + "px";
    });

    yesBtn.addEventListener("click", () => {
      firstPage.style.display = "none";
      secondPage.style.display = "block";
      music.play();
    });
  </script>

</body>
</html>
